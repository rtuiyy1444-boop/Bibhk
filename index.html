<!DOCTYPE html>
<html>

<head>

<title>Pink Mods</title>

<style>

body{
background:#ffd6ec;
font-family:Arial;
text-align:center;
}

h1{
color:#ff2f92;
font-size:40px;
}

#search{
padding:10px;
width:300px;
border-radius:20px;
border:1px solid pink;
}

.mods{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.mod{
background:white;
width:250px;
border-radius:15px;
padding:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.mod img{
width:100%;
border-radius:10px;
}

button{
background:#ff4da6;
color:white;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
}

.stars{
font-size:20px;
cursor:pointer;
color:gray;
}

.downloads{
color:#ff2f92;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🌸 Pink Mods 🌸</h1>

<input id="search" placeholder="ابحث عن مود">

<div class="mods" id="mods">

<div class="mod" data-name="pink house">

<img src="https://via.placeholder.com/250">

<h3>مود البيت الوردي</h3>

<div class="stars" onclick="rate(this)">
★ ★ ★ ★ ★
</div>

<p class="downloads">تحميلات: <span>0</span></p>

<button onclick="download(this)">
تحميل
</button>

</div>

<div class="mod" data-name="pink clothes">

<img src="https://via.placeholder.com/250">

<h3>مود ملابس وردية</h3>

<div class="stars" onclick="rate(this)">
★ ★ ★ ★ ★
</div>

<p class="downloads">تحميلات: <span>0</span></p>

<button onclick="download(this)">
تحميل
</button>

</div>

</div>

<script>

let search = document.getElementById("search");

search.addEventListener("keyup",function(){

let value = search.value.toLowerCase();
let mods = document.querySelectorAll(".mod");

mods.forEach(function(mod){

let name = mod.dataset.name;

if(name.includes(value))
mod.style.display="block";
else
mod.style.display="none";

});

});

function download(btn){

let count = btn.parentElement.querySelector(".downloads span");

count.innerHTML = parseInt(count.innerHTML)+1;

window.open("https://www.mediafire.com/");

}

function rate(stars){

stars.style.color="gold";

}

</script>

</body>
</html>
